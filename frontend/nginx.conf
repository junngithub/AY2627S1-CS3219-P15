# AI Assistance Disclosure
# Tool: Claude Code (Claude Opus 5), date: 2026-09-23
# Scope: Generated nginx config for serving the single-page app and proxying
#        the backend services behind one origin.
# Reviewed by Ngooi Jun Sen.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Needed because the proxy_pass targets below are
    # written as variables: that defers name resolution to request time, so
    # this container still starts when a backend is not running yet. Without
    # it, nginx refuses to start if any upstream name does not resolve.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # One origin for the page and the APIs, so the browser never makes a
    # cross-origin request and no service needs CORS headers. Each service
    # keeps its own port inside the foc network; none is published to the host.

    # Supplier Service. Its routes already live under this prefix, so the path
    # is passed through unchanged.
    location /api/v1/supplier {
        set $supplier_upstream http://supplier-service:8081;
        proxy_pass $supplier_upstream$request_uri;
        include /etc/nginx/proxy_headers.conf;
    }

    # The authorize endpoint is service-to-service (User F4): every backend
    # calls it to check a token. A browser has no reason to, so it stays
    # unreachable from outside, like the badge job endpoints below.
    location = /api/v1/user/authorize {
        return 404;
    }

    # User Service. TODO(team): no port is agreed yet; 8082 is a placeholder
    # that must match the service's compose entry and vite.config.ts.
    location /api/v1/user {
        set $user_upstream http://user-service:8082;
        proxy_pass $user_upstream$request_uri;
        include /etc/nginx/proxy_headers.conf;
    }

    # Admin Service. Same placeholder caveat: 8083 until the team picks one.
    location /api/v1/admin {
        set $admin_upstream http://admin-service:8083;
        proxy_pass $admin_upstream$request_uri;
        include /etc/nginx/proxy_headers.conf;
    }

    # The badge job endpoints are service-to-service and admin only. They must
    # not be reachable from a browser, whatever the prefix.
    location /api/v1/badges/internal {
        return 404;
    }

    # Badges Service. It serves the contract's base path directly, so the path
    # is passed through unchanged.
    location /api/v1/badges {
        set $badges_upstream http://badges-service:4006;
        proxy_pass $badges_upstream$request_uri;
        include /etc/nginx/proxy_headers.conf;
    }

    # Hashed build assets never change, so they can be cached for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Client-side routes: refreshing /orders/123 must return index.html, not 404.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
