# AI Assistance Disclosure
# Tool: Claude Code (Claude Opus 5), date: 2026-09-23
# Scope: Generated nginx config for serving the single-page app and proxying
#        the backend services behind one origin.
# Reviewed by Ngooi Jun Sen.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Needed because the proxy_pass targets below are
    # written as variables: that defers name resolution to request time, so
    # this container still starts when a backend is not running yet. Without
    # it, nginx refuses to start if any upstream name does not resolve.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # One origin for the page and the APIs, so the browser never makes a
    # cross-origin request and no service needs CORS headers. Each service
    # keeps its own port inside the foc network; none is published to the host.

    # Supplier Service. Its routes already live under this prefix, so the path
    # is passed through unchanged.
    location /api/v1/supplier {
        set $supplier_upstream http://supplier-service:8081;
        proxy_pass $supplier_upstream$request_uri;
        include /etc/nginx/proxy_headers.conf;
    }

    # User's internal prefix is service-to-service, never exposed to browsers.
    location = /api/v1/user/internal {
        return 404;
    }
    location ^~ /api/v1/user/internal/ {
        return 404;
    }

    # The legacy authorize alias is service-to-service (User F4): every backend
    # calls it to check a token. A browser has no reason to, so it stays
    # unreachable from outside, like the badge job endpoints below.
    location = /api/v1/user/authorize {
        return 404;
    }

    # User Service. Port must match user-service/docker-compose.yml.
    location /api/v1/user {
        set $user_upstream http://user-service:8080;
        proxy_pass $user_upstream$request_uri;
        include /etc/nginx/proxy_headers.conf;
    }

    # Admin Service. Port from admin-service/Dockerfile (8084).
    location /api/v1/admin {
        set $admin_upstream http://admin-service:8084;
        proxy_pass $admin_upstream$request_uri;
        include /etc/nginx/proxy_headers.conf;
    }

    # The gateway's auth check (infra ADR-0007), done here for local runs.
    # Order and Credit do not read tokens: they trust X-User-Id, which the
    # gateway sets from User's authorize response. Without this, every call
    # to them from the local frontend is refused. A subrequest only: it sends
    # the client's Authorization header and no body, as the gateway does.
    location = /_authorize {
        internal;
        set $authorize_upstream http://user-service:8080;
        # With a variable in proxy_pass, this URI replaces the request's.
        proxy_pass $authorize_upstream/api/v1/user/internal/authorize;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
    }

    # Order Service. Port from order-service's application.yml (8083).
    location /api/v1/orders {
        auth_request /_authorize;
        auth_request_set $foc_user_id $upstream_http_x_user_id;
        auth_request_set $foc_is_admin $upstream_http_x_is_admin;
        auth_request_set $foc_permitted_action $upstream_http_x_permitted_action;

        # Collection and delivery photos are up to 10 MB (Order NFR5.1).
        client_max_body_size 11m;

        set $order_upstream http://order-service:8083;
        proxy_pass $order_upstream$request_uri;
        include /etc/nginx/proxy_headers.conf;
        # Set from the authorize response, so a client-sent value is replaced.
        proxy_set_header X-User-Id $foc_user_id;
        proxy_set_header X-Is-Admin $foc_is_admin;
        proxy_set_header X-Permitted-Action $foc_permitted_action;
        # TODO(order-service): Order also reads X-User-Telegram, which neither
        # authorize nor the gateway provides, so it arrives empty.
        proxy_set_header X-User-Telegram "";
    }

    # Credit's internal prefix is Order's reserve/release: the body names the
    # user, so a browser could spend anyone's credits.
    location = /api/v1/credit/internal {
        return 404;
    }
    location ^~ /api/v1/credit/internal/ {
        return 404;
    }

    # Credit Service. Port from credit-service/docker-compose.yml (8082).
    location /api/v1/credit {
        auth_request /_authorize;
        auth_request_set $foc_user_id $upstream_http_x_user_id;
        auth_request_set $foc_is_admin $upstream_http_x_is_admin;
        auth_request_set $foc_permitted_action $upstream_http_x_permitted_action;

        set $credit_upstream http://credit-service:8082;
        proxy_pass $credit_upstream$request_uri;
        include /etc/nginx/proxy_headers.conf;
        proxy_set_header X-User-Id $foc_user_id;
        proxy_set_header X-Is-Admin $foc_is_admin;
        proxy_set_header X-Permitted-Action $foc_permitted_action;
    }

    # The badge job endpoints are service-to-service and admin only. They must
    # not be reachable from a browser, whatever the prefix.
    location /api/v1/badges/internal {
        return 404;
    }

    # Badges Service. It serves the contract's base path directly, so the path
    # is passed through unchanged.
    location /api/v1/badges {
        set $badges_upstream http://badges-service:4006;
        proxy_pass $badges_upstream$request_uri;
        include /etc/nginx/proxy_headers.conf;
    }

    # Hashed build assets never change, so they can be cached for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Client-side routes: refreshing /orders/123 must return index.html, not 404.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
