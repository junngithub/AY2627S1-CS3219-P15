services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: user_service
      POSTGRES_PASSWORD: user_service_dev
    ports:
      - "5554:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_service -d user_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - user-db-data:/var/lib/postgresql/data

  user-service:
    build: .
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: development
      PORT: 8080
      DATABASE_URL: postgresql://user_service:user_service_dev@db:5432/user_db
      ALLOWED_EMAIL_DOMAINS: u.nus.edu,nus.edu.sg
      OTP_SECRET: local-development-secret-change-me
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && npm run dev"

volumes:
  user-db-data:
