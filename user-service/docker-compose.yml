services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: user_service
      POSTGRES_PASSWORD: user_service_dev
    ports:
      - "5554:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_service -d user_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - user-db-data:/var/lib/postgresql/data

  user-service:
    build:
      context: .
      target: build  # dev tooling (prisma CLI, ts-node-dev); the default image is the slim runtime
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: development
      PORT: 8080
      DATABASE_URL: postgresql://user_service:user_service_dev@db:5432/user_db
      ALLOWED_EMAIL_DOMAINS: u.nus.edu,nus.edu.sg
      OTP_SECRET: local-development-secret-change-me
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_RESEND_COOLDOWN_SECONDS: ${TELEGRAM_RESEND_COOLDOWN_SECONDS:-60}
      TELEGRAM_POLLING_ENABLED: ${TELEGRAM_POLLING_ENABLED:-true}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:5173}
      PASSWORD_RESET_TTL_MINUTES: ${PASSWORD_RESET_TTL_MINUTES:-30}
      APP_ENV: ${APP_ENV:-local}
      ORDER_USER_LOOKUP_TOKEN: ${ORDER_USER_LOOKUP_TOKEN:-}
      ENABLE_TEST_VERIFICATION: ${ENABLE_TEST_VERIFICATION:-false}
      USER_DELETION_SWEEP_INTERVAL_SECONDS: ${USER_DELETION_SWEEP_INTERVAL_SECONDS:-3600}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-development}
      SES_FROM_EMAIL: ${SES_FROM_EMAIL:-}
      AWS_REGION: ${AWS_REGION:-ap-southeast-1}
      # Optional temporary AWS credentials for local SES testing only.
      # No host AWS directory is mounted or copied into the image.
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && npm run dev"

volumes:
  user-db-data:
