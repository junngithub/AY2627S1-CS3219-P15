# Argo CD objects for the NON-PROD EKS cluster. The root Application
# created by infra/nonprod/bootstrap applies this file plus projects/.
#
# Environments on this cluster: dev → namespace foc-dev, stg → namespace foc-stg
# (stg is commented out until infra/nonprod/aws creates its AWS resources).
#
# Ordering: Kafka objects need Strimzi's CRDs, and services need Strimzi's
# Kafka user Secrets. Instead of cross-app sync waves (which ApplicationSets
# don't honour), every app retries until its dependencies exist.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: strimzi
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: foc-platform
  source:
    repoURL: https://github.com/junngithub/AY2627S1-CS3219-P15.git
    targetRevision: main
    path: deploy/charts/strimzi
    helm:
      valueFiles:
        - ../../values/clusters/nonprod/strimzi.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: strimzi
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true # Strimzi CRDs exceed the client-side apply annotation limit
    retry:
      limit: 10
      backoff: { duration: 10s, factor: 2, maxDuration: 5m }
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: envoy-gateway
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: foc-platform
  source:
    repoURL: https://github.com/junngithub/AY2627S1-CS3219-P15.git
    targetRevision: main
    path: deploy/charts/envoy-gateway
  destination:
    server: https://kubernetes.default.svc
    namespace: envoy-gateway-system
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true # Gateway API / Envoy Gateway CRDs are large
    retry:
      limit: 10
      backoff: { duration: 10s, factor: 2, maxDuration: 5m }
---
# AWS glue (ADR-0013): the Load Balancer Controller binds each env's Envoy
# proxies to its Terraform-made NLB; External Secrets copies Secrets Manager
# into each env's Secrets; cluster-config holds the gp3 StorageClass, the
# secret stores, the RDS CA bundle and the TargetGroupBindings (it retries
# until the other two have installed their CRDs).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aws-load-balancer-controller
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: foc-platform
  source:
    repoURL: https://github.com/junngithub/AY2627S1-CS3219-P15.git
    targetRevision: main
    path: deploy/charts/aws-load-balancer-controller
    helm:
      valueFiles:
        - ../../values/clusters/nonprod/aws-load-balancer-controller.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 10
      backoff: { duration: 10s, factor: 2, maxDuration: 5m }
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: foc-platform
  source:
    repoURL: https://github.com/junngithub/AY2627S1-CS3219-P15.git
    targetRevision: main
    path: deploy/charts/external-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true # its CRDs are large
    retry:
      limit: 10
      backoff: { duration: 10s, factor: 2, maxDuration: 5m }
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-config
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: foc-platform
  source:
    repoURL: https://github.com/junngithub/AY2627S1-CS3219-P15.git
    targetRevision: main
    path: deploy/charts/cluster-config
    helm:
      valueFiles:
        - ../../values/clusters/nonprod/cluster-config.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - SkipDryRunOnMissingResource=true # ESO / LB controller CRDs may not exist yet
    retry:
      limit: 10
      backoff: { duration: 10s, factor: 2, maxDuration: 5m }
---
# Linkerd service mesh and its certificates (ADR-0012). Same retry-until-ready
# ordering as above: cert-manager → trust-manager → linkerd-crds →
# linkerd-identity → linkerd. Services synced before Linkerd is up start
# unmeshed (the injector fails open); restart them once after the first
# bootstrap (deploy/README.md, "Service mesh").
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: foc-platform
  source:
    repoURL: https://github.com/junngithub/AY2627S1-CS3219-P15.git
    targetRevision: main
    path: deploy/charts/cert-manager
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true # cert-manager CRDs are large
    retry:
      limit: 10
      backoff: { duration: 10s, factor: 2, maxDuration: 5m }
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trust-manager
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: foc-platform
  source:
    repoURL: https://github.com/junngithub/AY2627S1-CS3219-P15.git
    targetRevision: main
    path: deploy/charts/trust-manager
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry: # its webhook certificate needs cert-manager first
      limit: 10
      backoff: { duration: 10s, factor: 2, maxDuration: 5m }
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: linkerd-crds
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: foc-platform
  source:
    repoURL: https://github.com/junngithub/AY2627S1-CS3219-P15.git
    targetRevision: main
    path: deploy/charts/linkerd-crds
  destination:
    server: https://kubernetes.default.svc
    namespace: linkerd
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    # Linkerd's chart only creates its namespace for `linkerd install`; these
    # are the labels it would set (no webhooks or injection on the control
    # plane; linkerd-init needs privileged pod security).
    managedNamespaceMetadata:
      labels:
        linkerd.io/is-control-plane: "true"
        config.linkerd.io/admission-webhooks: disabled
        linkerd.io/control-plane-ns: linkerd
        pod-security.kubernetes.io/enforce: privileged
      annotations:
        linkerd.io/inject: disabled
    retry:
      limit: 10
      backoff: { duration: 10s, factor: 2, maxDuration: 5m }
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: linkerd-identity
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: foc-platform
  source:
    repoURL: https://github.com/junngithub/AY2627S1-CS3219-P15.git
    targetRevision: main
    path: deploy/charts/linkerd-identity
  destination:
    server: https://kubernetes.default.svc
    namespace: linkerd
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    retry: # needs cert-manager's and trust-manager's CRDs
      limit: 10
      backoff: { duration: 10s, factor: 2, maxDuration: 5m }
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: linkerd
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: foc-platform
  source:
    repoURL: https://github.com/junngithub/AY2627S1-CS3219-P15.git
    targetRevision: main
    path: deploy/charts/linkerd
  destination:
    server: https://kubernetes.default.svc
    namespace: linkerd
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - ServerSideApply=true
    retry: # its pods wait for the issuer Secret and trust-roots ConfigMap
      limit: 10
      backoff: { duration: 10s, factor: 2, maxDuration: 5m }
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: foc-namespaces
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - { env: dev, namespace: foc-dev }
          # - { env: stg, namespace: foc-stg } # with "stg" in infra/nonprod/aws var.envs
  template:
    metadata:
      name: "{{ .env }}-namespace"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: foc
      source:
        repoURL: https://github.com/junngithub/AY2627S1-CS3219-P15.git
        targetRevision: main
        path: deploy/charts/foc-namespace
        helm:
          valueFiles:
            - "../../values/envs/{{ .env }}/namespace.yaml"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ .namespace }}"
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions:
          - CreateNamespace=true
        managedNamespaceMetadata:
          labels:
            foc.io/env: "{{ .env }}"
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: foc-kafka
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - { env: dev, namespace: foc-dev }
          # - { env: stg, namespace: foc-stg } # with "stg" in infra/nonprod/aws var.envs
  template:
    metadata:
      name: "{{ .env }}-kafka"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: foc
      source:
        repoURL: https://github.com/junngithub/AY2627S1-CS3219-P15.git
        targetRevision: main
        path: deploy/charts/foc-kafka
        helm:
          valueFiles:
            - "../../values/envs/{{ .env }}/kafka.yaml"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ .namespace }}"
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions:
          - CreateNamespace=true
          - SkipDryRunOnMissingResource=true # Strimzi CRDs may not exist yet
        retry:
          limit: 10
          backoff: { duration: 10s, factor: 2, maxDuration: 5m }
---
# Each env's databases and logins on the shared RDS instance (ADR-0010). The
# Secrets come from Secrets Manager (createSecrets: false); the setup Job runs
# as a PostSync hook. Services' migrate Jobs retry until it has run.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: foc-database
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - { env: dev, namespace: foc-dev }
          # - { env: stg, namespace: foc-stg } # with "stg" in infra/nonprod/aws var.envs
  template:
    metadata:
      name: "{{ .env }}-database"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: foc
      source:
        repoURL: https://github.com/junngithub/AY2627S1-CS3219-P15.git
        targetRevision: main
        path: deploy/charts/foc-database
        helm:
          valueFiles:
            - "../../values/envs/{{ .env }}/database.yaml"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ .namespace }}"
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions:
          - CreateNamespace=true
          - SkipDryRunOnMissingResource=true # ExternalSecret CRD may not exist yet
        retry:
          limit: 10
          backoff: { duration: 10s, factor: 2, maxDuration: 5m }
---
# One Application per service values file in values/envs/<env>/services/.
# Adding a service to an env = adding that file.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: foc-services
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - list:
              elements:
                - { env: dev, namespace: foc-dev }
                # - { env: stg, namespace: foc-stg } # with "stg" in infra/nonprod/aws var.envs
          - git:
              repoURL: https://github.com/junngithub/AY2627S1-CS3219-P15.git
              revision: main
              files:
                - path: "deploy/values/envs/{{ .env }}/services/*.yaml"
  template:
    metadata:
      name: '{{ .env }}-{{ trimSuffix ".yaml" .path.filename }}'
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: foc
      source:
        repoURL: https://github.com/junngithub/AY2627S1-CS3219-P15.git
        targetRevision: main
        path: deploy/charts/foc-service
        helm:
          # Later files override earlier ones.
          valueFiles:
            - "../../values/services/{{ .path.filename }}"
            - "../../values/envs/{{ .env }}/common.yaml"
            - "../../values/envs/{{ .env }}/services/{{ .path.filename }}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ .namespace }}"
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions:
          - CreateNamespace=true
        retry:
          limit: 10
          backoff: { duration: 10s, factor: 2, maxDuration: 5m }
---
# Each env's entry point (Gateway, routes, auth). Needs Envoy Gateway's CRDs
# and the env's User service; retries until both exist.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: foc-gateway
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - { env: dev, namespace: foc-dev }
          # - { env: stg, namespace: foc-stg } # with "stg" in infra/nonprod/aws var.envs
  template:
    metadata:
      name: "{{ .env }}-gateway"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: foc
      source:
        repoURL: https://github.com/junngithub/AY2627S1-CS3219-P15.git
        targetRevision: main
        path: deploy/charts/foc-gateway
        helm:
          valueFiles:
            - "../../values/envs/{{ .env }}/gateway.yaml"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ .namespace }}"
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions:
          - CreateNamespace=true
          - SkipDryRunOnMissingResource=true # Envoy Gateway CRDs may not exist yet
        retry:
          limit: 10
          backoff: { duration: 10s, factor: 2, maxDuration: 5m }
