{{- range .Values.envs }}
# Env {{ .name }}'s secrets: foc/{{ .name }}/* in Secrets Manager, usable only
# from {{ .namespace }}. Credentials: the node role (infra/<cluster>/aws/
# node-permissions.tf), or the role in secretsRoleArn if set. NUS's service
# control policy denies sts:AssumeRole, so nonprod leaves it unset (ADR-0013).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-{{ .name }}
spec:
  conditions:
    - namespaces: [{{ .namespace }}]
  provider:
    aws:
      service: SecretsManager
      region: {{ required "region is required" $.Values.region }}
      {{- with .secretsRoleArn }}
      role: {{ . }}
      {{- end }}
---
{{- end }}
