{{- if not .Values.createSecrets }}
{{- $store := required "externalSecrets.store is required when createSecrets is false" .Values.externalSecrets.store }}
# Cloud: the same Secrets as secrets.yaml, from AWS Secrets Manager (ADR-0010).
# Admin login: RDS keeps it in its own secret ({username, password}); host and
# port come from values.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: foc-db-admin
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $store }}
  target:
    name: foc-db-admin
    template:
      data:
        PGHOST: {{ required "host is required" .Values.host | quote }}
        PGPORT: {{ .Values.port | quote }}
        PGUSER: {{ `"{{ .username }}"` }}
        PGPASSWORD: {{ `"{{ .password }}"` }}
        PGDATABASE: {{ .Values.admin_database | quote }}
        PGSSLMODE: {{ .Values.sslMode | quote }}
  dataFrom:
    - extract:
        key: {{ required "externalSecrets.adminSecret is required" .Values.externalSecrets.adminSecret }}
{{- range $service, $_ := .Values.services }}
---
# Service {{ $service }}'s login: secret <prefix>{{ $service }}-db holds the
# same keys secrets.yaml writes locally.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $service }}-db
  labels:
    foc.io/service: {{ $service }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $store }}
  target:
    name: {{ $service }}-db
    template:
      metadata:
        labels:
          foc.io/service: {{ $service }}
  dataFrom:
    - extract:
        key: {{ printf "%s%s-db" $.Values.externalSecrets.prefix $service }}
{{- end }}
{{- end }}
