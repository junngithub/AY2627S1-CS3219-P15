{{- if .Values.createSecrets }}
{{- $host := required "host is required" .Values.host }}
# Admin login, used only by the setup Job.
apiVersion: v1
kind: Secret
metadata:
  name: foc-db-admin
type: Opaque
stringData:
  PGHOST: {{ $host | quote }}
  PGPORT: {{ .Values.port | quote }}
  PGUSER: {{ required "admin_username is required" .Values.admin_username | quote }}
  PGPASSWORD: {{ required "admin_password is required" .Values.admin_password | quote }}
  PGDATABASE: {{ .Values.admin_database | quote }}
  PGSSLMODE: {{ .Values.sslMode | quote }}
{{- range $service, $cfg := .Values.services }}
{{- $name := include "foc-database.dbName" (dict "env" $.Values.env "service" $service) }}
{{- $password := required (printf "services.%s.password is required" $service) $cfg.password }}
---
# Service {{ $service }}'s login to its own database only.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $service }}-db
  labels:
    foc.io/service: {{ $service }}
type: Opaque
stringData:
  DATABASE_URL: {{ printf "postgresql://%s:%s@%s:%v/%s" $name $password $host $.Values.port $name | quote }}
  PGHOST: {{ $host | quote }}
  PGPORT: {{ $.Values.port | quote }}
  PGDATABASE: {{ $name | quote }}
  PGUSER: {{ $name | quote }}
  PGPASSWORD: {{ $password | quote }}
{{- end }}
{{- end }}
