{{- /*
`helm test <release>`: real requests through this env's Envoy proxy, without
logging in: every protected prefix demands a token, bad or missing tokens get
401, spoofed identity headers don't get a request through, public routes reach
their service without auth, internal and unknown paths are 404 at the gateway.
It doesn't log in, so it can't see which identity headers reach a backend (the
real services don't echo them). Argo CD ignores Helm test hooks.
*/ -}}
{{- $gw := printf "http://%s.%s:%d" (include "foc-gateway.envoyServiceName" .) .Values.envoyNamespace (int .Values.listenerPort) }}
apiVersion: v1
kind: Pod
metadata:
  name: foc-gateway-test
  labels:
    app.kubernetes.io/part-of: foc
    foc.io/test: gateway
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  restartPolicy: Never
  containers:
    - name: curl
      image: {{ .Values.tests.curlImage }}
      command: ["sh", "-c"]
      args:
        - |
          GW={{ $gw }}
          PASS=0; FAIL=0
          pass() { echo "PASS $*"; PASS=$((PASS + 1)); }
          fail() { echo "FAIL $*"; FAIL=$((FAIL + 1)); }
          req() { curl -s -m 5 -o /tmp/body -w '%{http_code}' "$@"; }
          has() { grep -q -F "$1" /tmp/body; }

          echo "== waiting for the gateway at $GW"
          for i in $(seq 1 30); do
            [ "$(req "$GW{{ (first .Values.routes).prefix }}/conntest")" = 401 ] && break
            sleep 2
          done

          echo "== 1. every protected prefix demands a token"
          {{- range .Values.routes }}
          code=$(req "$GW{{ .prefix }}/conntest")
          [ "$code" = 401 ] && pass "{{ .prefix }} without a token → 401" || fail "{{ .prefix }} without a token → HTTP $code $(cat /tmp/body)"
          {{- end }}

          echo "== 2. bad credentials"
          code=$(req -H "Authorization: Bearer not-a-valid-token" "$GW{{ (first .Values.routes).prefix }}/conntest")
          [ "$code" = 401 ] && pass "invalid token → 401" || fail "invalid token → HTTP $code"
          code=$(req -H "x-user-id: mallory@u.nus.edu" -H "x-is-admin: true" "$GW{{ (first .Values.routes).prefix }}/conntest")
          [ "$code" = 401 ] && pass "spoofed identity headers without a token → 401" || fail "spoofed headers without a token → HTTP $code"

          echo "== 3. public routes reach their service without auth"
          {{- range .Values.publicRoutes }}
          code=$(req -X {{ .method }} "$GW{{ .path }}")
          # Any answer from the service counts (400, 401 for bad credentials, ...).
          # Not: no connection, a 5xx, the gateway demanding auth, or the
          # gateway's own empty 404 for a route it doesn't have.
          if [ "$code" = 000 ] || [ "${code#5}" != "$code" ]; then fail "{{ .method }} {{ .path }}: HTTP $code $(cat /tmp/body)"
          elif has '"code":"UNAUTHORIZED"'; then fail "{{ .method }} {{ .path }}: asked for a token"
          elif [ "$code" = 404 ] && [ ! -s /tmp/body ]; then fail "{{ .method }} {{ .path }}: no route at the gateway"
          else pass "{{ .method }} {{ .path }} → {{ .service }} without auth (HTTP $code)"; fi
          {{- end }}

          echo "== 4. blocked and unknown paths"
          {{- range .Values.blockedPaths }}
          code=$(req -X POST "$GW{{ . }}")
          [ "$code" = 404 ] && pass "{{ . }} (internal) → 404 at the gateway" || fail "{{ . }} → HTTP $code"
          {{- end }}
          {{- range .Values.blockedPrefixes }}
          code=$(req -X POST -H "Authorization: Bearer not-a-valid-token" "$GW{{ . }}")
          [ "$code" = 404 ] && pass "{{ . }} (internal) → 404 at the gateway" || fail "{{ . }} → HTTP $code"
          code=$(req -X POST -H "X-Service-Token: client-supplied-token" "$GW{{ . }}/")
          [ "$code" = 404 ] && pass "{{ . }}/ (trailing slash) → 404 at the gateway" || fail "{{ . }}/ → HTTP $code"
          code=$(req -H "X-Service-Token: client-supplied-token" "$GW{{ . }}/x/00000000-0000-0000-0000-000000000000")
          [ "$code" = 404 ] && pass "{{ . }}/… (sub-path) → 404 at the gateway" || fail "{{ . }}/… → HTTP $code"
          {{- end }}
          code=$(req "$GW/not-a-route")
          [ "$code" = 404 ] && pass "unknown path → 404" || fail "unknown path → HTTP $code"

          echo "== $PASS passed, $FAIL failed"
          [ "$FAIL" -eq 0 ]
      resources:
        requests: { cpu: 10m, memory: 16Mi }
        limits: { cpu: 100m, memory: 32Mi }
