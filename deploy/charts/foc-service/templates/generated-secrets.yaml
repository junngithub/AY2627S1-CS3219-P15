{{- /* Local only, see generatedSecrets in values.yaml. */ -}}
{{- range $name, $keys := .Values.generatedSecrets }}
{{- $existing := get (lookup "v1" "Secret" $.Release.Namespace $name | default dict) "data" | default dict }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "foc-service.labels" $ | nindent 4 }}
type: Opaque
data:
  {{- range $keys }}
  {{ . }}: {{ get $existing . | default (randAlphaNum 48 | b64enc) }}
  {{- end }}
{{- end }}
