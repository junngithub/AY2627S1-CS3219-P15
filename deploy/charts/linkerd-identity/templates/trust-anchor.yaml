# Linkerd's trust anchor: a self-signed root CA kept by cert-manager.
#   ClusterIssuer linkerd-selfsigned  → Certificate linkerd-trust-anchor (root)
#   ClusterIssuer linkerd-trust-anchor (CA backed by that root) → issuer.yaml
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: linkerd-selfsigned
  labels:
    {{- include "linkerd-identity.labels" . | nindent 4 }}
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: linkerd-trust-anchor
  namespace: {{ .Values.certManagerNamespace }}
  labels:
    {{- include "linkerd-identity.labels" . | nindent 4 }}
spec:
  isCA: true
  commonName: root.linkerd.cluster.local
  secretName: linkerd-trust-anchor
  duration: {{ .Values.trustAnchor.duration }}
  renewBefore: {{ .Values.trustAnchor.renewBefore }}
  privateKey:
    algorithm: ECDSA
    size: 256
    # Keep the key if cert-manager ever renews the root: a renewed root with the
    # same key and name still validates every issuer and proxy certificate.
    rotationPolicy: Never
  issuerRef:
    name: linkerd-selfsigned
    kind: ClusterIssuer
    group: cert-manager.io
---
# A ClusterIssuer reads its CA Secret from cert-manager's own namespace, which is
# where the trust anchor's Secret is.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: linkerd-trust-anchor
  labels:
    {{- include "linkerd-identity.labels" . | nindent 4 }}
spec:
  ca:
    secretName: linkerd-trust-anchor
