# order-service: settings that are the same in every environment.
name: order
image:
  name: foc/order-service
port: 8083 # server.port in order-service/src/main/resources/application.yml
healthPath: /health # application-k8s.yml serves Actuator's health here too; DOWN if the database is unreachable
database:
  enabled: true # Secret order-db (charts/foc-database, ADR-0010); read via secretEnv below
kafka:
  user: order # writes 4 topics, reads foc.admin.events (ADR-0004)
# No migrate Job: Flyway migrates the schema in-process at startup.
env:
  # application-k8s.yml: database from PG*, Kafka over TLS + SCRAM from KAFKA_*.
  SPRING_PROFILES_ACTIVE: k8s
  # Size the heap from the container limit (the JVM default is 25% of it).
  JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=60
  # Peers this service calls over HTTP (short names resolve within the env's namespace).
  CREDIT_SERVICE_URL: http://credit:3000 # reserve / release credits
  SUPPLIER_SERVICE_URL: http://supplier:8081 # validate pickup/dropoff locations
  RATING_SERVICE_URL: http://rating:3000 # requester / courier rating
  ADMIN_SERVICE_URL: http://admin:3000 # open an escalation
  USER_SERVICE_URL: http://user:8080 # profile (email, Telegram)
secretEnv:
  # JDBC can't use DATABASE_URL (postgresql://), so application-k8s.yml builds
  # the JDBC URL from the Secret's libpq-style keys.
  PGHOST: { secret: order-db, key: PGHOST }
  PGPORT: { secret: order-db, key: PGPORT }
  PGDATABASE: { secret: order-db, key: PGDATABASE }
  PGUSER: { secret: order-db, key: PGUSER }
  PGPASSWORD: { secret: order-db, key: PGPASSWORD }
  ORDER_USER_LOOKUP_TOKEN:
    { secret: order-user-lookup, key: ORDER_USER_LOOKUP_TOKEN }
resources: # a JVM needs more than the chart default
  requests:
    cpu: 100m
    memory: 384Mi
  limits:
    # Without one the namespace default (500m) applies: startup then takes
    # ~28s instead of ~9s, close to the liveness probe's restart at ~50s.
    cpu: "1"
    memory: 768Mi
