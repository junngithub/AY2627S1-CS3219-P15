# Local run of the deployable app image, its database, and Kafka.
# Deployment ships only the image built from Dockerfile. Postgres and Kafka are external there.
# The app container uses the dev profile. A host IDE uses the local profile against the published ports.
services:
  order-db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${ORDER_DB_USERNAME}
      POSTGRES_PASSWORD: ${ORDER_DB_PASSWORD}
      POSTGRES_DB: order
    ports:
      - "5432:5432"
    volumes:
      - order-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

  # MinIO stands in for S3 on the dev profile. Host ports avoid SonarQube on 9000.
  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${ORDER_PHOTOS_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${ORDER_PHOTOS_SECRET_KEY}
    ports:
      - "9100:9000"
      - "9101:9001"
    volumes:
      - order-photo-bucket:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${ORDER_PHOTOS_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${ORDER_PHOTOS_SECRET_KEY}
      ORDER_PHOTOS_BUCKET: ${ORDER_PHOTOS_BUCKET}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" && mc mb --ignore-existing "local/$$ORDER_PHOTOS_BUCKET"

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    depends_on:
      - kafka
    ports:
      - "8184:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: foc
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "true"

  kafka-consumer:
    image: apache/kafka:3.9.1
    depends_on:
      - kafka
    entrypoint: ["/bin/bash", "-c"]
    command:
      - sleep 15 && exec /opt/kafka/bin/kafka-console-consumer.sh --bootstrap-server kafka:29092 --include 'foc\..*' --group kafka-viewer --from-beginning --property print.topic=true --property print.key=true

  kafka-tools:
    image: apache/kafka:3.9.1
    depends_on:
      - kafka
    entrypoint: ["sleep", "infinity"]
    volumes:
      - ./kafka:/defaults:ro

  order-service:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      order-db:
        condition: service_healthy
      kafka:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: dev
      ORDER_DB_URL: ${ORDER_DB_URL}
      ORDER_DB_USERNAME: ${ORDER_DB_USERNAME}
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD}
      ORDER_KAFKA_BOOTSTRAP_SERVERS: ${ORDER_KAFKA_BOOTSTRAP_SERVERS}
      ORDER_PHOTOS_ENDPOINT: ${ORDER_PHOTOS_ENDPOINT}
      ORDER_PHOTOS_BUCKET: ${ORDER_PHOTOS_BUCKET}
      ORDER_PHOTOS_REGION: ${ORDER_PHOTOS_REGION}
      ORDER_PHOTOS_ACCESS_KEY: ${ORDER_PHOTOS_ACCESS_KEY}
      ORDER_PHOTOS_SECRET_KEY: ${ORDER_PHOTOS_SECRET_KEY}
      ORDER_PHOTOS_PATH_STYLE: ${ORDER_PHOTOS_PATH_STYLE}
    ports:
      - "8083:8083"

volumes:
  order-db-data:
  order-photo-bucket:
