services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: supplier_db
      POSTGRES_USER: supplier_user
      POSTGRES_PASSWORD: supplier_pass
    ports:
      - "5555:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supplier_user -d supplier_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  supplier-service:
    build:
      context: .
      target: build  # dev tooling (prisma CLI, ts-node-dev); the default image is the slim runtime
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma
    ports:
      - "8081:8081"
    environment:
      DATABASE_URL: postgresql://supplier_user:supplier_pass@db:5432/supplier_db
      PORT: 8081
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && npm run dev"

volumes:
  pgdata: