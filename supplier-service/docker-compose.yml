services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: supplier_db
      POSTGRES_USER: supplier_user
      POSTGRES_PASSWORD: supplier_pass
    ports:
      - "5555:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  supplier-service:
    build: .
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma
    ports:
      - "8081:8081"
    environment:
      DATABASE_URL: postgresql://supplier_user:supplier_pass@db:5432/supplier_db
      PORT: 8081
    depends_on:
      - db
    command: npm run dev

volumes:
  pgdata: